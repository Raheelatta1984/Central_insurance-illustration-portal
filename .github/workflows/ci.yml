name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests with coverage (money proof included)
        run: npm run test:coverage
      - name: Build UI and server
        run: npm run build
      - name: Generated artefacts must be in sync with the code
        run: |
          npm run docs:api
          git diff --exit-code -- demo/ docs/API-REFERENCE.md
      - name: Fleet backlog check (claimable chunks must still be verified)
        run: node tools/fleet.mjs --limit=5 --dry
