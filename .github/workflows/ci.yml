name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests with coverage (money proof included)
        run: npm run test:coverage
      - name: Build UI and server
        run: npm run build
      - name: Generated artefacts must be in sync with the code
        run: |
          npm run docs:api
          git diff --exit-code -- demo/ docs/API-REFERENCE.md
      - name: Fleet backlog check (claimable chunks must still be verified)
        run: node tools/fleet.mjs --limit=5 --dry
  reconciliation-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: recon_ci_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build:server
      - name: Native Postgres isolation and migration tests
        env:
          RECON_TEST_DATABASE_URL: postgresql://postgres:recon_ci_only@127.0.0.1:5432/postgres
        run: npx vitest run src/server/reconciliation/postgres.test.ts --reporter=verbose
