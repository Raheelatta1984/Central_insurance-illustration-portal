version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint peer-supports typescript <6.1.0; keep single grouped PR installable under `npm ci`
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
