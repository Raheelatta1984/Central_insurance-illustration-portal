;; Generated by src/core/pgbouncer.ts (npm run infra:plan -- --ini) — review before deploying.
;; This file contains NO password. Put credentials in userlist.txt (chmod 600) and point
;; auth_file at it. Committing a password here would put the database in the git history.
;; Pool mode: transaction. Server connections: 4 instance(s) × 20 = 80 of 200 (20 reserved, 100 headroom).

[databases]
portal = host=postgres-primary:5432 sslmode=disable

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = portal
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 180
server_idle_timeout = 60
server_lifetime = 3600
server_connect_timeout = 10
query_wait_timeout = 15
client_idle_timeout = 300
tcp_keepalive = 30
application_name_add_host = 1
max_prepared_statements = 100
ignore_startup_parameters = extra_float_digits,options

; WARNING: max_prepared_statements=100 tracks prepared statements across server connections; raise it if a single client prepares more than that
