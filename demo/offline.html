tId":"GRP:ALK-TKF:REINS:COMMISSION","name":"ALK-TKF — Ceding commission / wakalah fee","type":"income","amount":"72.00 AED"},{"accountId":"GRP:ALK-TKF:REINS:PAYABLE","name":"ALK-TKF — Payable to reinsurers / retakaful operators","type":"liability","amount":"360.00 AED"},{"accountId":"GRP:ALK-TKF:REINS:RECEIVABLE","name":"ALK-TKF — Receivable from reinsurers / retakaful operators","type":"asset","amount":"72.00 AED"},{"accountId":"GRP:ALK-TKF:SHARE-CAPITAL","name":"ALK-TKF — Paid-up share capital","type":"equity","amount":"3,000,000.00 AED"},{"accountId":"GRP:TRANSLATION-RESERVE","name":"Translation reserve (cumulative)","type":"equity","amount":"-151,800.00 AED"}]}}},"GET /api/health":{"status":200,"body":{"ok":true,"version":1,"asOf":"2026-10-05"}},"GET /api/ledger/proof":{"status":200,"body":{"conventional":{"balanced":true,"byCurrency":[{"currency":"AED","debit":{"minor":"1294179418","currency":"AED"},"credit":{"minor":"1294179418","currency":"AED"}}]},"takaful":{"balanced":true,"byCurrency":[{"currency":"AED","debit":{"minor":"302300200","currency":"AED"},"credit":{"minor":"302300200","currency":"AED"}}]},"unitHoldings":9}},"GET /api/regulatory/uae-rules":{"status":200,"body":{"country":"AE","rules":[{"id":"UAE-RI-01","title":"Reinsure only with a company licensed to carry the class","severity":"refuse","instrument":"Article (42) — Federal Decree-Law No. 48 of 2023 Regulating Insurance Activities","inForce":"30 November 2023","note":"replaced by Federal Decree-Law No. 6 of 2025 from 16 September 2025, with a transition to 16 September 2026","clause":"Article (42): The Company may not reinsure with another company unless the other company is licensed to carry out the insurance type entrusted to reinsure it.","requirement":"The counterparty must be licensed for the class of business ceded — a UAE licence, or a home-state licence naming the class for a reinsurer abroad. A UAE carrier may reinsure inside or outside the State, but never with an unlicensed company.","requirementAr":"لا يجوز للشركة أن تعيد التأمين لدى شركة أخرى ما لم تكن تلك الشركة مرخصة لمزاولة نوع التأمين المطلوب إعادة تأمينه.","evidence":["home-state licence certificate","CBUAE licence extract"]},{"id":"UAE-RI-02","title":"A counterparty at or above the rating floor, or board diligence on file","severity":"refuse","instrument":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","inForce":"2019, as carried into the rulebook","note":"Article (18) sets the classification requirement for reinsurers; Articles (31), (38) and (39) are cited by the rules that use them","clause":"Article (18): acceptance of reinsurance business is conditional on the reinsurer meeting the classification stipulated, and business exceeding retention must be covered with reinsurers who have that classification, subject to the stated exceptions.","requirement":"A reinsurance counterparty should hold a financial strength rating of BBB (S&P) or equivalent — Baa2 or better — or, if it does not, the placement needs documented board-level due diligence before it is bound.","requirementAr":"يُشترط في شركة إعادة التأمين الحصول على تصنيف مالي لا يقل عن BBB أو ما يعادله، وإلا وجب توثيق العناية الواجبة على مستوى مجلس الإدارة.","evidence":["rating agency report","board-diligence-minute"]},{"id":"UAE-RI-03","title":"Recoverables count as admissible assets only at or above the floor","severity":"disclose","instrument":"Minimum capital requirement — CBUAE financial regulations — capital, assets and technical provisions","inForce":"as carried into the rulebook","note":null,"clause":"Assets available to meet insurance liabilities may include reinsurance recoverables where the reinsurer is rated BBB or better.","requirement":"Money due from a counterparty below the floor is not an admissible asset: the return must show the recoverable without credit for it, and the solvency position must be read with that in mind.","requirementAr":"لا تُعد المبالغ المستحقة من معيد تأمين دون التصنيف المطلوب أصولاً مقبولة، ويجب بيانها دون احتساب رصيد لها.","evidence":["solvency return extract","rating agency report"]},{"id":"UAE-RI-04","title":"Every cession sits inside the board-approved retention and reinsurance plan","severity":"refuse","instrument":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","inForce":"2019, as carried into the rulebook","note":"Article (18) sets the classification requirement for reinsurers; Articles (31), (38) and (39) are cited by the rules that use them","clause":"The company shall prepare a three-year plan concerning retention and reinsurance for each type and class, approve it at the board, and review it annually during the three months before each year, covering retention and treaty limits, treaty types and facultative cessions.","requirement":"A cession must be permitted by the plan the board approved, and the plan must have been reviewed inside the year before the placement. A cession outside the plan is refused; a plan whose review window has passed is escalated.","requirementAr":"يجب أن تكون إعادة التأمين ضمن الخطة المعتمدة من مجلس الإدارة، وأن تُراجع الخطة سنوياً خلال الأشهر الثلاثة السابقة لكل سنة.","evidence":["approved retention and reinsurance plan","board minute of the annual review"]},{"id":"UAE-RI-05","title":"A foreign branch files its head-office reinsurance certificate every year","severity":"escalate","instrument":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","inForce":"2019, as carried into the rulebook","note":"Article (18) sets the classification requirement for reinsurers; Articles (31), (38) and (39) are cited by the rules that use them","clause":"A foreign insurance company operating in the State through a branch shall annually submit a certified certificate from its head office supporting that the business subscribed within the State and exceeding its retention is covered by reinsurance with reinsurers who have the classification stipulated in Article (18).","requirement":"Where the counterparty is the branch of a foreign company, its annual certified certificate must be on file and no more than twelve months old.","requirementAr":"على فرع شركة التأمين الأجنبية العاملة في الدولة أن يقدم سنوياً شهادة معتمدة من المركز الرئيسي تفيد بأن الأعمال التي تتجاوز حد الاحتفاظ مغطاة لدى معيدي تأمين حاصلين على التصنيف المطلوب.","evidence":["head office certificate"]},{"id":"UAE-RI-06","title":"Accepting treaty reinsurance needs approval and capital","severity":"refuse","instrument":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","inForce":"2019, as carried into the rulebook","note":"Article (18) sets the classification requirement for reinsurers; Articles (31), (38) and (39) are cited by the rules that use them","clause":"Article (39): in order to accept the treaty reinsurance business, the insurance company established in the State is required to obtain approval from the Director General, and the minimum subscribed and paid-up capital of the company shall not be less than AED 350,000,000.","requirement":"Inward treaty business may only be accepted with the Director General's approval, articles that authorise accepting reinsurance, and at least AED 350,000,000 of subscribed and paid-up capital.","requirementAr":"لا يجوز قبول أعمال إعادة التأمين الاتفاقي إلا بعد الحصول على موافقة المدير العام، وبألا يقل رأس المال المكتتب المدفوع عن 350,000,000 درهم.","evidence":["director-general approval","articles of association","paid-up capital certificate"]},{"id":"UAE-RI-07","title":"Facultative acceptance only within retention or under a treaty","severity":"refuse","instrument":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","inForce":"2019, as carried into the rulebook","note":"Article (18) sets the classification requirement for reinsurers; Articles (31), (38) and (39) are cited by the rules that use them","clause":"Article (38): the accepted liabilities shall be either within the company's retention or exceeding it, in which case the company must have a reinsurance treaty that protects the surplus and contains a provision allowing it to accept facultative reinsurance within determined limits; re-ceding that surplus facultatively needs the prior approval of the ceding company.","requirement":"Facultative business may be accepted only inside the retention or under a treaty that protects the surplus and permits facultative acceptance; passing the surplus on needs the ceding company's prior approval.","requirementAr":"لا يجوز قبول أعمال إعادة التأمين الاختياري إلا في حدود حد الاحتفاظ أو في وجود اتفاقية تحمي الفائض وتجيز القبول، مع الحصول على موافقة مسبقة من الشركة المتنازلة عند إعادة التنازل.","evidence":["ceding company approval","treaty extract"]},{"id":"UAE-RI-08","title":"A tender is only offered with a leading reinsurer behind the surplus","severity":"refuse","instrument":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","inForce":"2019, as carried into the rulebook","note":"Article (18) sets the classification requirement for reinsurers; Articles (31), (38) and (39) are cited by the rules that use them","clause":"Article (31): the company shall obtain approval, before submitting its offer, from a leading reinsurer that meets the conditions stipulated in Article (18), where the tender's cover is one for which the company has no reinsurance treaty covering the surplus above its retention.","requirement":"Where a tender is not covered by treaty, written approval from a leading reinsurer that meets the classification requirement must be on file before the offer goes in.","requirementAr":"يجب الحصول على موافقة من معيد تأمين رائد يستوفي شروط المادة (18) قبل تقديم العرض إذا لم تكن تغطية المناقصة مشمولة باتفاقية إعادة تأمين.","evidence":["leading reinsurer approval"]},{"id":"UAE-RI-09","title":"Participant risk money goes to retakaful only","severity":"refuse","instrument":"Article (42) — Federal Decree-Law No. 48 of 2023 Regulating Insurance Activities","inForce":"30 November 2023","note":"replaced by Federal Decree-Law No. 6 of 2025 from 16 September 2025, with a transition to 16 September 2026","clause":"Article (42), read with the takaful regulations: the class entrusted must be carried by the counterparty, and a takaful operator's participant risk fund may only be protected by retakaful.","requirement":"A takaful window cedes only to a retakaful operator or a Shariah-compliant retakaful window. Participant risk money never enters a conventional pool — a breach is refused at the register, not corrected afterwards.","requirementAr":"لا يجوز لصندوق مخاطر المشتركين في شركة تكافل أن يعيد التأمين إلا لدى معيد تكافل، ولا يجوز تحويل أموال المخاطر للمشتركين إلى صندوق تقليدي.","evidence":["retakaful certificate","shariah committee approval"]},{"id":"UAE-RI-10","title":"A free-zone company reinsures, and does nothing else outside the zone","severity":"disclose","instrument":"Article (42) — Federal Decree-Law No. 48 of 2023 Regulating Insurance Activities","inForce":"30 November 2023","note":"replaced by Federal Decree-Law No. 6 of 2025 from 16 September 2025, with a transition to 16 September 2026","clause":"Article (64): insurance companies licensed to operate in the financial free zones may not carry out any activity outside such zones in the State, except for reinsurance.","requirement":"A free-zone counterparty is a permitted reinsurer: the placement may stand, and the decision records the limit on what that company may do outside its zone.","requirementAr":"لا يجوز لشركات التأمين المرخصة في المناطق المالية الحرة مزاولة أي نشاط خارج تلك المناطق داخل الدولة، باستثناء إعادة التأمين.","evidence":["free-zone licence extract"]},{"id":"UAE-RI-11","title":"A foreign branch lodges the bank guarantee its licence requires","severity":"refuse","instrument":"Article (42) — Federal Decree-Law No. 48 of 2023 Regulating Insurance Activities","inForce":"30 November 2023","note":"replaced by Federal Decree-Law No. 6 of 2025 from 16 September 2025, with a transition to 16 September 2026","clause":"Article (50): the foreign insurance company's branch shall submit an irrevocable bank guarantee in favour of the CBUAE of not less than AED 100,000,000 where it carries on insurance activity, and not less than AED 250,000,000 where it carries on reinsurance activity.","requirement":"Where the counterparty is a foreign branch writing reinsurance, an irrevocable bank guarantee of at least AED 250,000,000 (AED 100,000,000 for insurance) must be lodged with the CBUAE.","requirementAr":"يقدم فرع شركة التأمين الأجنبية ضماناً مصرفياً غير قابل للإلغاء لصالح المصرف المركزي لا يقل عن 100,000,000 درهم لمزاولة التأمين و250,000,000 درهم لمزاولة إعادة التأمين.","evidence":["bank guarantee"]},{"id":"UAE-RI-12","title":"UAE risk insured at home, protected anywhere","severity":"disclose","instrument":"Article (82) — Federal Decree-Law No. 6 of 2025 on the Central Bank, the Regulation of Financial Institutions and Activities, and Insurance Business","inForce":"16 September 2025","note":"consolidates the insurance law into the CBUAE mandate; the reinsurance freedoms and controls of the 2023 law are carried forward","clause":"Article (82)(2): a UAE insurer may reinsure its business with reinsurers located in the UAE or outside the State; a policy may not be concluded with a company outside the State to cover money or property within the State.","requirement":"The risk stays with a licensed UAE carrier and the reinsurance may be placed anywhere — the decision records which of the two this placement is.","requirementAr":"يجوز لشركة التأمين في الدولة إعادة تأمين أعمالها لدى معيدي تأمين داخل الدولة أو خارجها، دون جواز إبرام وثيقة لدى شركة خارج الدولة لتغطية أموال أو ممتلكات داخل الدولة.","evidence":["placement file"]}],"decisions":[{"id":"UAE-RULE-000001","subject":"QS-25-2026 cession of LIFE-0001 and the motor book","at":"2026-09-30","by":"reinsurance/life-desk","basis":"conventional","counterparty":"Emirates Re","decision":"allow","evidence":"Allowed: every rule that applies to QS-25-2026 cession of LIFE-0001 and the motor book with Emirates Re is met with the evidence on file. Rests on Article (42) — Federal Decree-Law No. 48 of 2023 Regulating Insurance Activities; Minimum capital requirement — CBUAE financial regulations — capital, assets and technical provisions and 2 further citation(s). Decided by reinsurance/life-desk at 2026-09-30","blocking":[],"findings":[{"ruleId":"UAE-RI-01","title":"Reinsure only with a company licensed to carry the class","state":"met","severity":"refuse","detail":"Emirates Re holds a all licence in the UAE","clause":"Article (42) — Federal Decree-Law No. 48 of 2023 Regulating Insurance Activities","requirement":"The counterparty must be licensed for the class of business ceded — a UAE licence, or a home-state licence naming the class for a reinsurer abroad. A UAE carrier may reinsure inside or outside the State, but never with an unlicensed company.","requirementAr":"لا يجوز للشركة أن تعيد التأمين لدى شركة أخرى ما لم تكن تلك الشركة مرخصة لمزاولة نوع التأمين المطلوب إعادة تأمينه.","evidenceRequired":[],"evidenceOnFile":[],"evidenceMissing":[]},{"ruleId":"UAE-RI-03","title":"Recoverables count as admissible assets only at or above the floor","state":"met","severity":"disclose","detail":"A means recoverables from Emirates Re may be admitted","clause":"Minimum capital requirement — CBUAE financial regulations — capital, assets and technical provisions","requirement":"Money due from a counterparty below the floor is not an admissible asset: the return must show the recoverable without credit for it, and the solvency position must be read with that in mind.","requirementAr":"لا تُعد المبالغ المستحقة من معيد تأمين دون التصنيف المطلوب أصولاً مقبولة، ويجب بيانها دون احتساب رصيد لها.","evidenceRequired":[],"evidenceOnFile":[],"evidenceMissing":[]},{"ruleId":"UAE-RI-04","title":"Every cession sits inside the board-approved retention and reinsurance plan","state":"met","severity":"refuse","detail":"the plan was reviewed on 2026-02-10, 7 month(s) before this placement","clause":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","requirement":"A cession must be permitted by the plan the board approved, and the plan must have been reviewed inside the year before the placement. A cession outside the plan is refused; a plan whose review window has passed is escalated.","requirementAr":"يجب أن تكون إعادة التأمين ضمن الخطة المعتمدة من مجلس الإدارة، وأن تُراجع الخطة سنوياً خلال الأشهر الثلاثة السابقة لكل سنة.","evidenceRequired":[],"evidenceOnFile":[],"evidenceMissing":[]},{"ruleId":"UAE-RI-12","title":"UAE risk insured at home, protected anywhere","state":"met","severity":"disclose","detail":"the risk is retained by a licensed UAE carrier and the reinsurance is placed with Emirates Re (QS-25-2026)","clause":"Article (82) — Federal Decree-Law No. 6 of 2025 on the Central Bank, the Regulation of Financial Institutions and Activities, and Insurance Business","requirement":"The risk stays with a licensed UAE carrier and the reinsurance may be placed anywhere — the decision records which of the two this placement is.","requirementAr":"يجوز لشركة التأمين في الدولة إعادة تأمين أعمالها لدى معيدي تأمين داخل الدولة أو خارجها، دون جواز إبرام وثيقة لدى شركة خارج الدولة لتغطية أموال أو ممتلكات داخل الدولة.","evidenceRequired":[],"evidenceOnFile":[],"evidenceMissing":[]}]},{"id":"UAE-RULE-000002","subject":"RTKF-QS-20 cession of TKF-0001","at":"2026-09-30","by":"takaful/reinsurance-desk","basis":"takaful he counterparty must be licensed for the class of business ceded — a UAE licence, or a home-state licence naming the class for a reinsurer abroad. A UAE carrier may reinsure inside or outside the State, but never with an unlicensed company.","requirementAr":"لا يجوز للشركة أن تعيد التأمين لدى شركة أخرى ما لم تكن تلك الشركة مرخصة لمزاولة نوع التأمين المطلوب إعادة تأمينه.","evidence":["home-state licence certificate","CBUAE licence extract"]},{"id":"UAE-RI-02","title":"A counterparty at or above the rating floor, or board diligence on file","severity":"refuse","instrument":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","inForce":"2019, as carried into the rulebook","note":"Article (18) sets the classification requirement for reinsurers; Articles (31), (38) and (39) are cited by the rules that use them","clause":"Article (18): acceptance of reinsurance business is conditional on the reinsurer meeting the classification stipulated, and business exceeding retention must be covered with reinsurers who have that classification, subject to the stated exceptions.","requirement":"A reinsurance counterparty should hold a financial strength rating of BBB (S&P) or equivalent — Baa2 or better — or, if it does not, the placement needs documented board-level due diligence before it is bound.","requirementAr":"يُشترط في شركة إعادة التأمين الحصول على تصنيف مالي لا يقل عن BBB أو ما يعادله، وإلا وجب توثيق العناية الواجبة على مستوى مجلس الإدارة.","evidence":["rating agency report","board-diligence-minute"]},{"id":"UAE-RI-03","title":"Recoverables count as admissible assets only at or above the floor","severity":"disclose","instrument":"Minimum capital requirement — CBUAE financial regulations — capital, assets and technical provisions","inForce":"as carried into the rulebook","note":null,"clause":"Assets available to meet insurance liabilities may include reinsurance recoverables where the reinsurer is rated BBB or better.","requirement":"Money due from a counterparty below the floor is not an admissible asset: the return must show the recoverable without credit for it, and the solvency position must be read with that in mind.","requirementAr":"لا تُعد المبالغ المستحقة من معيد تأمين دون التصنيف المطلوب أصولاً مقبولة، ويجب بيانها دون احتساب رصيد لها.","evidence":["solvency return extract","rating agency report"]},{"id":"UAE-RI-04","title":"Every cession sits inside the board-approved retention and reinsurance plan","severity":"refuse","instrument":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","inForce":"2019, as carried into the rulebook","note":"Article (18) sets the classification requirement for reinsurers; Articles (31), (38) and (39) are cited by the rules that use them","clause":"The company shall prepare a three-year plan concerning retention and reinsurance for each type and class, approve it at the board, and review it annually during the three months before each year, covering retention and treaty limits, treaty types and facultative cessions.","requirement":"A cession must be permitted by the plan the board approved, and the plan must have been reviewed inside the year before the placement. A cession outside the plan is refused; a plan whose review window has passed is escalated.","requirementAr":"يجب أن تكون إعادة التأمين ضمن الخطة المعتمدة من مجلس الإدارة، وأن تُراجع الخطة سنوياً خلال الأشهر الثلاثة السابقة لكل سنة.","evidence":["approved retention and reinsurance plan","board minute of the annual review"]},{"id":"UAE-RI-05","title":"A foreign branch files its head-office reinsurance certificate every year","severity":"escalate","instrument":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","inForce":"2019, as carried into the rulebook","note":"Article (18) sets the classification requirement for reinsurers; Articles (31), (38) and (39) are cited by the rules that use them","clause":"A foreign insurance company operating in the State through a branch shall annually submit a certified certificate from its head office supporting that the business subscribed within the State and exceeding its retention is covered by reinsurance with reinsurers who have the classification stipulated in Article (18).","requirement":"Where the counterparty is the branch of a foreign company, its annual certified certificate must be on file and no more than twelve months old.","requirementAr":"على فرع شركة التأمين الأجنبية العاملة في الدولة أن يقدم سنوياً شهادة معتمدة من المركز الرئيسي تفيد بأن الأعمال التي تتجاوز حد الاحتفاظ مغطاة لدى معيدي تأمين حاصلين على التصنيف المطلوب.","evidence":["head office certificate"]},{"id":"UAE-RI-06","title":"Accepting treaty reinsurance needs approval and capital","severity":"refuse","instrument":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","inForce":"2019, as carried into the rulebook","note":"Article (18) sets the classification requirement for reinsurers; Articles (31), (38) and (39) are cited by the rules that use them","clause":"Article (39): in order to accept the treaty reinsurance business, the insurance company established in the State is required to obtain approval from the Director General, and the minimum subscribed and paid-up capital of the company shall not be less than AED 350,000,000.","requirement":"Inward treaty business may only be accepted with the Director General's approval, articles that authorise accepting reinsurance, and at least AED 350,000,000 of subscribed and paid-up capital.","requirementAr":"لا يجوز قبول أعمال إعادة التأمين الاتفاقي إلا بعد الحصول على موافقة المدير العام، وبألا يقل رأس المال المكتتب المدفوع عن 350,000,000 درهم.","evidence":["director-general approval","articles of association","paid-up capital certificate"]},{"id":"UAE-RI-07","title":"Facultative acceptance only within retention or under a treaty","severity":"refuse","instrument":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","inForce":"2019, as carried into the rulebook","note":"Article (18) sets the classification requirement for reinsurers; Articles (31), (38) and (39) are cited by the rules that use them","clause":"Article (38): the accepted liabilities shall be either within the company's retention or exceeding it, in which case the company must have a reinsurance treaty that protects the surplus and contains a provision allowing it to accept facultative reinsurance within determined limits; re-ceding that surplus facultatively needs the prior approval of the ceding company.","requirement":"Facultative business may be accepted only inside the retention or under a treaty that protects the surplus and permits facultative acceptance; passing the surplus on needs the ceding company's prior approval.","requirementAr":"لا يجوز قبول أعمال إعادة التأمين الاختياري إلا في حدود حد الاحتفاظ أو في وجود اتفاقية تحمي الفائض وتجيز القبول، مع الحصول على موافقة مسبقة من الشركة المتنازلة عند إعادة التنازل.","evidence":["ceding company approval","treaty extract"]},{"id":"UAE-RI-08","title":"A tender is only offered with a leading reinsurer behind the surplus","severity":"refuse","instrument":"Article (18) — CBUAE reinsurance regulations (Insurance Authority Board Decision No. 23 of 2019, carried into the CBUAE rulebook)","inForce":"2019, as carried into the rulebook","note":"Article (18) sets the classification requirement for reinsurers; Articles (31), (38) and (39) are cited by the rules that use them","clause":"Article (31): the company shall obtain approval, before submitting its offer, from a leading reinsurer that meets the conditions stipulated in Article (18), where the tender's cover is one for which the company has no reinsurance treaty covering the surplus above its retention.","requirement":"Where a tender is not covered by treaty, written approval from a leading reinsurer that meets the classification requirement must be on file before the offer goes in.","requirementAr":"يجب الحصول على موافقة من معيد تأمين رائد يستوفي شروط المادة (18) قبل تقديم العرض إذا لم تكن تغطية المناقصة مشمولة باتفاقية إعادة تأمين.","evidence":["leading reinsurer approval"]},{"id":"UAE-RI-09","title":"Participant risk money goes to retakaful only","severity":"refuse","instrument":"Article (42) — Federal Decree-Law No. 48 of 2023 Regulating Insurance Activities","inForce":"30 November 2023","note":"replaced by Federal Decree-Law No. 6 of 2025 from 16 September 2025, with a transition to 16 September 2026","clause":"Article (42), read with the takaful regulations: the class entrusted must be carried by the counterparty, and a takaful operator's participant risk fund may only be protected by retakaful.","requirement":"A takaful window cedes only to a retakaful operator or a Shariah-compliant retakaful window. Participant risk money never enters a conventional pool — a breach is refused at the register, not corrected afterwards.","requirementAr":"لا يجوز لصندوق مخاطر المشتركين في شركة تكافل أن يعيد التأمين إلا لدى معيد تكافل، ولا يجوز تحويل أموال المخاطر للمشتركين إلى صندوق تقليدي.","evidence":["retakaful certificate","shariah committee approval"]},{"id":"UAE-RI-10","title":"A free-zone company reinsures, and does nothing else outside the zone","severity":"disclose","instrument":"Article (42) — Federal Decree-Law No. 48 of 2023 Regulating Insurance Activities","inForce":"30 November 2023","note":"replaced by Federal Decree-Law No. 6 of 2025 from 16 September 2025, with a transition to 16 September 2026","clause":"Article (64): insurance companies licensed to operate in the financial free zones may not carry out any activity outside such zones in the State, except for reinsurance.","requirement":"A free-zone counterparty is a permitted reinsurer: the placement may stand, and the decision records the limit on what that company may do outside its zone.","requirementAr":"لا يجوز لشركات التأمين المرخصة في المناطق المالية الحرة مزاولة أي نشاط خارج تلك المناطق داخل الدولة، باستثناء إعادة التأمين.","evidence":["free-zone licence extract"]},{"id":"UAE-RI-11","title":"A foreign branch lodges the bank guarantee its licence requires","severity":"refuse","instrument":"Article (42) — Federal Decree-Law No. 48 of 2023 Regulating Insurance Activities","inForce":"30 November 2023","note":"replaced by Federal Decree-Law No. 6 of 2025 from 16 September 2025, with a transition to 16 September 2026","clause":"Article (50): the foreign insurance company's branch shall submit an irrevocable bank guarantee in favour of the CBUAE of not less than AED 100,000,000 where it carries on insurance activity, and not less than AED 250,000,000 where it carries on reinsurance activity.","requirement":"Where the counterparty is a foreign branch writing reinsurance, an irrevocable bank guarantee of at least AED 250,000,000 (AED 100,000,000 for insurance) must be lodged with the CBUAE.","requirementAr":"يقدم فرع شركة التأمين الأجنبية ضماناً مصرفياً غير قابل للإلغاء لصالح المصرف المركزي لا يقل عن 100,000,000 درهم لمزاولة التأمين و250,000,000 درهم لمزاولة إعادة التأمين.","evidence":["bank guarantee"]},{"id":"UAE-RI-12","title":"UAE risk insured at home, protected anywhere","severity":"disclose","instrument":"Article (82) — Federal Decree-Law No. 6 of 2025 on the Central Bank, the Regulation of Financial Institutions and Activities, and Insurance Business","inForce":"16 September 2025","note":"consolidates the insurance law into the CBUAE mandate; the reinsurance freedoms and controls of the 2023 law are carried forward","clause":"Article (82)(2): a UAE insurer may reinsure its business with reinsurers located in the UAE or outside the State; a policy may not be concluded with a company outside the State to cover money or pro .",doThis:["Set a switch amount, pick the funds, and read the preview: units out, units in, fee, net invested.","Move the instruction time past the 15:00 cut-off and watch the valuation date move.","Open the withdrawal preview: cash to customer, units realised, remaining value, and the rule that priced it.","Read the projection envelopes — adverse, central, favourable — and the disclaimer wording."],expect:["Crossing the cut-off changes the valuation date, not the amount.","The illustration is labelled; the engine never presents a projection as a promise."],api:["POST /api/preview/switch","POST /api/preview/withdrawal"]},{at:"00:16",minutes:5,tab:"cover",title:"Pay for cover only while cover is on",why:"Daily, pay-as-you-go and start/stop cover as a billing primitive: nothing restarts by itself, and a day is either paid or cover suspends — there is no halfway charge.",doThis:["Look at the segments: start, stop, daily rate, what has been charged.","Stop cover, then advance the clock a few days and watch nothing accrue.","Start cover again, advance the clock, and watch only the active days charge.","Empty the wallet and tick again: cover suspends instead of going negative."],expect:["Charges appear only for days inside an active window.","After a stop, no day charges until someone explicitly starts again."],api:["POST /api/cover/start","POST /api/cover/stop","POST /api/cover/tick"]},{at:"00:21",minutes:5,tab:"funds",title:"Run the NAV engine and see the rules behind a price",why:"Fund managers and auditors argue about valuation points. Here the cut-off, the business-day calendar, the floor price and its named residual are all visible, and reconciliation is an assertion, not a promise.",doThis:["Read the valuation history per fund, including today.","Read the look-through composition and any Shariah composition warnings.","Find the reconciliation line: units × price + residual = NAV.","Check the fund management charge accrual."],expect:["The reconciliation ties exactly, with the residual named rather than buried in rounding.","A non-screened instrument inside a Shariah fund raises a warning instead of passing silently."],api:["GET /api/world"]},{at:"00:26",minutes:6,tab:"takaful",title:"Run a takaful window that is structural, not cosmetic",why:"Three funds, a real wakalah fee, tabarru into the risk pool, qard hasan when the pool is short, and a surplus that cannot be distributed until the actuary, the Shariah Committee and the board have all signed — with the UAE rule that participants never receive surplus applied on top.",doThis:["Read the three pool balances and the operator fund.","Read the qard: who lent to whom, how much is outstanding, and how it is repaid.","Try to distribute the surplus and read the blockers, one by one.","Sign as actuary, then Shariah, then board, and watch the blockers fall away."],expect:["The distribution is refused until every gate is satisfied, and the refusal names the missing one.","The surplus stays inside its own pool; nothing leaks into the operator fund."],api:["POST /api/takaful/approve"]},{at:"00:32",minutes:6,tab:"group",title:"Consolidate three entities, two currencies, one set of books",why:"The part most ERP demos fake: assets and liabilities at the closing rate, income and expenses at the average rate, equity at the rate on the day it moved, the gap shown as a translation reserve, intercompany eliminated, and a minority interest stated rather than absorbed.",doThis:["Read the three entities: functional currency, ownership, net assets, result, translation reserve.","Read the intercompany table: one pair agrees and eliminates cleanly, the other does not and shows in transit.","Find the minority interest line: 30% of the Malaysian subsidiary, stated separately.",'Press "Run the consolidation" twice and watch nothing new get posted.'],expect:["The consolidated balance sheet balances, and the group ledger proves itself.","Consolidating again is idempotent, and the entity books are untouched."],api:["GET /api/group","POST /api/group/consolidate"]},{at:"00:38",minutes:5,tab:"underwriting",title:"Underwrite against a manual held as data",why:"Loadings are shown line by line with the reason and the evidence each one demands, referrals go to a named human, and anything above the automatic binding limit is flagged for the reinsurer before the policy is issued. An AI agent may accept or rate inside its own limit and may never decline.",doThis:["Read the accepted book: standard premium against loaded premium.","Open the 2.5m application and read the referral points.",'Press "Ask the AI agent to decide" and read the refusal and the referral.','Press "Senior underwriter takes the case" and watch the referral points be recorded as waived, by name.'],expect:["Every loading and exclusion carries a reason code and a plain sentence.","The AI cannot decline a risk; the referral is recorded with the role that owns it."],api:["GET /api/underwriting","POST /api/underwriting/decide"]},{at:"00:43",minutes:5,tab:"claims",title:"Pay a claim through authority, not through a spreadsheet",why:"Triage decides straight-through, referral or decline; a reserve is a booked liability rather than a note; approval is checked against a real authority table; settlement releases the reserve and recoveries are posted as their own income. In the takaful window the same workflow draws on the participants risk fund.",doThis:["Read the position: reserved, expense incurred, cash paid, recoveries, net cost.","Open the settled motor claim and read its timeline, then its salvage recovery.",'Open the open critical-illness claim and press "Ask the AI to approve 25,000.00" — read the refusal.',"Open the takaful claim and read where the money came from."],expect:["An AI approval above its straight-through limit is refused, and the limit is named.","A pooled claim moves cash exactly once, from the risk fund, with qard hasan if the pool is short."],api:["GET /api/claims","POST /api/claims/register","POST /api/claims/approve","POST /api/claims/settle"]},{at:"00:48",minutes:6,tab:"reinsurance",title:"Hand part of the risk to someone else, on the record",why:"An insurer that keeps every risk whole is one bad quarter from ruin. This is the treaty register and the utilisation statement behind it: a quota share on the life case, a surplus treaty over a 200,000 retention, catastrophe cover, and a retakaful treaty for the takaful window — with the participant-money segregation rule enforced in code, the security behind every counterparty's promise measured against what it owes us, and the reporting extracts — the supervisory return, the actuary's exhibits and a bordereau per counterparty — built from the same register and refused issue when they do not tie to the books.",doThis:["Read the two statements: the conventional book and the takaful window, each with its own treaties.",'Press "Cede a further risk": the engine authorises the cession, prices it and posts it — and the utilisation statement moves. Naming the same risk twice is refused rather than double-counted.','Press "Place a risk facultatively": the reinsurer accepts the named risk first, then the premium moves.','Read "The refusals": a risk the reinsurer has not accepted, and participant money offered to a conventional treaty.','Press "Claim a catastrophe event", then "Reinstate the catastrophe cover": the layer pays above the retention, the cover is eaten, and the first reinstatement is free.',"Read the deposit card: premium paid on account is an asset, and the period settles against the real subject premium.",'Press "Settle the outstanding recovery": what the reinsurer still owes turns into cash, and the ageing resets.',`Read "Security behind the reinsurers' promises": Emirates Re carries a 50,000.00 shortfall while being six days late on the recovery it already owes — and Gulf Reinsurance PSC is holding 516.61 more security than its treaties require.`,'Press "Answer the outstanding cash call": the shortfall is called, then answered, and the cover goes to 100.00% with the cash posted to restricted cash.','Press "Release the security we no longer need": the surplus goes back, the payable returns to the books, and the release is journaled.',`Press "Credit the interest on their cash": interest earned on a counterparty's cash is theirs, and it is carried as more of what we owe them — a retakaful treaty refuses interest altogether.`,'Read "The supervisory return, issued": four schedules built from the register, eight controls each tied to a ledger account, and the issued fingerprint. A return that does not tie to the books cannot be issued at all.',"Open the actuary's exhibits and find the line that says what they do not claim to know: no IBNR, no discounting, no unexpired premium the ledger does not hold.",`Read "The window files its own return": the participant risk fund reports its own retakaful, in its own entity, with the wakalah fee shown as the operator's income rather than mixed in.`,'Press "Reissue the return after a later event": a catastrophe is claimed, the figures move, and version 2 is issued against version 1 with the reason written down — nothing is quietly rewritten.'],expect:["Ceded premium, commission, net retained premium and the recoverable appear in the books, not just on screen.","Every cession names the journal it produced, and the recoverable on the statement equals the receivable in the ledger.","A deposit-accounted treaty recognises no premium income and no claim expense at all — the balance sheet carries it until settlement.","Cash security and withheld premium appear as restricted cash and as security owed back; a letter of credit is disclosed and never posted as cash.","The cash call asks for the shortfall and nothing more, and a second call for the same gap is refused while the first is unanswered.","Each bordereau closes on the same figures the return carries for that counterparty, so a query lands on one number rather than three.","An issued extract reproduces exactly when it is recomputed; once later transactions move the books, the old extract stays as issued and says so."],api:["GET /api/reinsurance","GET /api/reinsurance/security","GET /api/extracts","POST /api/extracts/issue","POST /api/extracts/verify","POST /api/reinsurance/cede","POST /api/reinsurance/facultative","POST /api/reinsurance/recover","POST /api/reinsurance/event","POST /api/reinsurance/reinstate","POST /api/reinsurance/deposit","POST /api/reinsurance/deposit/settle","POST /api/reinsurance/settle","POST /api/reinsurance/security/hold","POST /api/reinsurance/security/call","POST /api/reinsurance/security/call/settle","POST /api/reinsurance/security/release","POST /api/reinsurance/security/interest"]},{at:"00:54",minutes:3,tab:"durability",title:"Prove the books, and the reporting registers, can be restored",why:"A demo that cannot survive a restart is not an ERP. This seals the books into a canonical, fingerprinted snapshot and rebuilds a fresh ledger from that text — and does the same for the reporting registers: the returns, rule decisions, letters and filings are sealed together, replayed into a fresh world and checked one by one, with a hash-chained outbox proving nothing was dropped between snapshots.",doThis:["Read the snapshot summary: accounts, journals, size, fingerprint.",'Press "Run durability drill".',"Read the per-entity result: balanced, trial balance agrees, restore time.","Read the reporting register card: how many returns, decisions, letters and filings it holds, and the outbox chain.",'Press "Rebuild every register from the snapshot" and read what came back.'],expect:["The restore reports the same journals and the same balances, in milliseconds.","The fingerprint is stable across runs, so a tampered payload would be caught.","Every reporting register replays: each return keeps its fingerprint, each rule decision follows again from its own facts, each letter regenerates from its own facts, and each filing carries the answer it got — with the outbox chaining from the beginning.","The actions the registers took come back too: the catastrophe recovery is claimed again through the reinsurance register and posts the same journal, and the books return journal for journal, not just to the same totals."],api:["GET /api/state","POST /api/state/drill","GET /api/state/registers","POST /api/state/registers/drill"]},{at:"00:57",minutes:3,tab:"overview",title:"The remainder of the hour: the fabric around the money",why:"The modules an insurer actually runs on — onboarding, ingestion, consent, regulatory packs, the UAE reinsurance rule book, renaming and AI governance, the rule book with its three answers and the wording book that holds the mandated paragraphs, and the submission log with the supervisor’s references — each one wired to something you can press, and the rule book answers with the answer the desk actually gets: allowed, held for a named human, or refused.",doThis:["Onboarding: read the chip read, the government lookup and the OCR consensus, then find the field in the review queue.","Ingestion: submit a file of any shape, watch it map its own columns, quarantine the bad rows and suppress the duplicate.","Parties & consent: run a partner lookup with consent, then without it, and read the access log.","Regulatory: read the pre-sale gates for motor and medical, the comparison matrix behind a motor quote, the UAE reinsurance rule book — put a placement past it and read the answer — the wording book, which drafts the letters with their mandated paragraphs in both languages, and the submission log — file the return, and record the reference that comes back.","Labels & rename: rename a label in one scope only and watch the other scope keep its own word.","Regulatory rule book: a clean placement is allowed and an unrated counterparty is held for a named human with the missing evidence listed — the two buttons give different answers on purpose.","Filing: the return goes through the CBUAE c :root { color-scheme: dark; --bg:#0b0f14; --panel:#131a22; --panel2:#182230; --line:#22303f; --text:#e8eef6; --muted:#8ba0b6; --accent:#3ea6ff; --ok:#2fbf71; --warn:#f0b429; --bad:#ef5b5b; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
.app { display:grid; grid-template-columns: 250px 1fr; min-height:100vh; }
aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:16px; gap:14px; position:sticky; top:0; height:100vh; }
.brand { display:flex; gap:10px; align-items:center; }
.brand .logo { width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(140deg,#3ea6ff,#2fbf71);color:#04121f;font-weight:700; }
.brand small { display:block; color:var(--muted); font-size:11px; }
nav { display:flex; flex-direction:column; gap:4px; overflow:auto; }
nav button { display:flex; gap:10px; align-items:center; background:transparent; border:0; color:var(--muted); text-align:left; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px; }
